[package]
name = "egosync"
version = "0.1.4"
description = "EgoSync - Your Digital Life Coordinator"
authors = ["EgoSync Team"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "egosync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
async-trait = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
chrono = "0.4"
tokio-util = "0.7"
rfd = "0.15"
indexmap = { version = "1", features = ["std"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[features]
perf-test = []

[dependencies.sysinfo]
version = "0.32"
default-features = false
features = ["system"]
