name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: egosync-app/src-tauri -> target

      - name: Remove local cargo config (rsproxy mirror)
        shell: bash
        run: rm -f egosync-app/src-tauri/.cargo/config.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: egosync-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: egosync-app
        run: npm ci

      - name: Run frontend tests
        working-directory: egosync-app
        run: npm run test:frontend

      - name: Run Rust tests
        working-directory: egosync-app/src-tauri
        run: cargo test

      - name: Build Tauri app
        working-directory: egosync-app
        run: npm run tauri build

      - name: Upload artifact (Windows)
        if: matrix.platform.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: egosync-0.1.0-windows
          path: egosync-app/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload artifact (macOS)
        if: matrix.platform.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: egosync-0.1.0-macos
          path: egosync-app/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload artifact (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: egosync-0.1.0-linux
          path: egosync-app/src-tauri/target/release/bundle/appimage/*.AppImage
