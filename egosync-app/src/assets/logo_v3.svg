<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" style="background:#0B0F19; border-radius:32px;">
  <defs>
    <!-- 数字分身渐变：赛博青 #00FFE0 到靛蓝 #4F46E5 -->
    <linearGradient id="twinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFE0" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    
    <!-- 环绕轨道渐变：霓虹紫 #A855F7 到粉红 #F43F5E -->
    <linearGradient id="orbitGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    
    <!-- 精致的脑部光晕 -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="200" height="200" fill="#0B0F19" rx="32"/>
  
  <!-- 1. 外围的同步循环轨道（代表数字自我自转，以渐变亮线烘托分身） -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#orbitGrad)" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  <path d="M 126,29 A 76,76 0 0,1 176,100 A 76,76 0 0,1 126,171" fill="none" stroke="url(#orbitGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 74,171 A 76,76 0 0,1 24,100 A 76,76 0 0,1 74,29" fill="none" stroke="#00FFE0" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8"/>
  
  <!-- 2. 数字分身 (Digital Twin) - 位于后侧，偏右上，带虚线网格数码感 -->
  <g transform="translate(10, -10)">
    <!-- 头部圆圈（虚线） -->
    <circle cx="106" cy="80" r="15" fill="none" stroke="url(#twinGrad)" stroke-width="4.5" stroke-dasharray="5 3"/>
    <!-- 肩膀（虚线） -->
    <path d="M 70,123 C 70,108 86,101 106,101 C 126,101 142,108 142,123" fill="none" stroke="url(#twinGrad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="6 3"/>
  </g>
  
  <!-- 3. 本体自我 (Physical Ego) - 位于前侧，偏左下，实线高级质感 -->
  <g transform="translate(-10, 10)">
    <!-- 头部圆圈 -->
    <circle cx="94" cy="120" r="15" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="94" cy="120" r="4.5" fill="#FFFFFF" filter="url(#coreGlow)"/>
    <!-- 肩膀 -->
    <path d="M 58,163 C 58,148 74,141 94,141 C 114,141 130,148 130,163" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <!-- 4. 同步传输链 (Digital Twin Sync Links) -->
  <!-- 脑部同步连线 -->
  <line x1="84" y1="130" x2="116" y2="70" stroke="#00FFE0" stroke-width="3" stroke-linecap="round" />
  <!-- 连接链路上的同步数据光斑 -->
  <circle cx="94" cy="111" r="2.5" fill="#00FFE0"/>
  <circle cx="106" cy="89" r="2.5" fill="#FFFFFF"/>
</svg>
