<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 左上折面渐变：纯白到亮银 -->
    <linearGradient id="silverGrad1_t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    
    <!-- 右上折面渐变：亮银到中灰 -->
    <linearGradient id="silverGrad2_t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    
    <!-- 左下折面渐变：中深灰到石墨黑 -->
    <linearGradient id="silverGrad3_t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    
    <!-- 右下折面渐变：暗石墨到边缘白反光 -->
    <linearGradient id="silverGrad4_t" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    
    <!-- 极纯白光自转流线渐变 -->
    <linearGradient id="silverOrbit_t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    
    <filter id="prismGlow_t" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 1. 周围环绕的动感同步宇宙流线 (纯银白流线) -->
  <path d="M 36,44 C 70,16 130,16 164,44 C 178,55 184,70 180,85" fill="none" stroke="url(#silverOrbit_t)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 164,156 C 130,184 70,184 36,156 C 22,145 16,130 20,115" fill="none" stroke="url(#silverOrbit_t)" stroke-width="2.2" stroke-linecap="round" transform="rotate(180, 100, 100)"/>
  
  <g transform="translate(100, 100)">
    <!-- 2. 四折面极简多棱晶体主体 (无隙缝纯明暗拼接，融入任意明暗底) -->
    <g stroke="none">
      <!-- 左上折面 -->
      <polygon points="0,-68 -52,0 0,0" fill="url(#silverGrad1_t)"/>
      
      <!-- 右上折面 -->
      <polygon points="0,-68 52,0 0,0" fill="url(#silverGrad2_t)"/>
      
      <!-- 左下折面 -->
      <polygon points="-52,0 0,68 0,0" fill="url(#silverGrad3_t)"/>
      
      <!-- 右下折面 -->
      <polygon points="0,68 52,0 0,0" fill="url(#silverGrad4_t)"/>
    </g>
    
    <!-- 3. 中心交汇聚焦亮点 -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" filter="url(#prismGlow_t)"/>
  </g>
</svg>
