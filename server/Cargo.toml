[package]
name = "egosync-server"
version = "0.1.6-alpha.3"
edition = "2021"
description = "EgoSync 云端自托管 server binary：web-ok 命令全量路由 + SSE 广播 + 单用户令牌认证（Epic 15/16 前置）"

[lib]
name = "egosync_server"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
egosync-engine = { path = "../crates/egosync-engine" }
serde = { version = "1", features = ["derive"] }
# preserve_order（Story 15.5）：与 engine 同款启用——server body 经 dispatch
# 的 Value 往返，键序须与桌面 invoke 直接序列化一致（对等测试逐命令钉死）。
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
# "json"（Story 17.1，架构 ⑦）：stdout JSON 结构化日志（容器 docker
# logs 直采）；"env-filter"：RUST_LOG 覆盖面。
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# "fs"（Story 16.1）：ServeDir/ServeFile 静态服务（web 入口同源服务 dist）。
tower-http = { version = "0.6", features = ["catch-panic", "fs"] }
# tower（Story 16.1）：仅取 Service trait（static.rs SPA 回退的自定义
# fallback 服务实现；版本与 axum 0.8 依赖树一致，无新依赖增量）。
tower = "0.5"
argon2 = { version = "0.5", features = ["std"] }
subtle = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
dirs = "5"
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# chrono（Story 17.3）：导出 attachment 文件名的本地日期（与桌面 export_json
# 落盘命名同构）；已在依赖树内（engine 同版本），无新增编译成本。
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
http-body-util = "0.1"

[features]
default = []
# gen_commands 生成器（Story 15.4 工件机械导出）：syn/quote 源码扫描为
# 构建期专用依赖，运行时 server 不携带。
gen = ["dep:syn", "dep:quote"]

[dependencies.syn]
version = "2"
features = ["full", "parsing", "printing"]
optional = true

[dependencies.quote]
version = "1"
optional = true

[[bin]]
name = "gen_commands"
path = "src/bin/gen_commands.rs"
required-features = ["gen"]

[[bin]]
name = "egosync-server"
path = "src/main.rs"

# ---- dev profile 瘦身（2026-09-21，磁盘治理）----
# 背景：本仓库三个工程各自为政的 target/ 曾在单轮构建后累计 ~24G 撑满磁盘。
# 1) debug = "line-tables-only"：回溯仍带文件/行号，但调试器无法检查变量
# 2) incremental = false：不再生成 incremental 缓存（此前一项即占 3.9G）
# 效果：target/debug 约 13G → 3-4G。需完整调试能力时删除本节即可恢复。
[profile.dev]
debug = "line-tables-only"
incremental = false
