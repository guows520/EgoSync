<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- 高雅的渐变：Indigo #6366F1 到 Cyan #06B6D4 -->
    <linearGradient id="minimalGradV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="softGlowV2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g transform="translate(100, 100)">
    <!-- 极简渐变缺口环 (Ego Orbit / Sync Path) -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#minimalGradV2)" stroke-width="14" stroke-linecap="round" stroke-dasharray="245 80" transform="rotate(-40)"/>
    
    <!-- 偏心排列的纯白心智焦点 (Butler Core / Ego Focus) -->
    <circle cx="20" cy="20" r="17" fill="#FFFFFF" filter="url(#softGlowV2)" />
  </g>
</svg>
