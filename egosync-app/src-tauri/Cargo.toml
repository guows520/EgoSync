[package]
name = "egosync"
version = "0.1.6-alpha.3"
description = "EgoSync - Your Digital Life Coordinator"
authors = ["EgoSync Team"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "egosync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5"
async-trait = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
chrono = "0.4"
tokio-util = "0.7"
rfd = "0.15"
indexmap = { version = "1", features = ["std"] }
companion-proto = { version = "0.1.0", path = "../../crates/companion-proto" }
# Story 13.1: 快照分帧 envelope 的 chunk 编码（已在依赖树中，此处置为直接依赖）
base64 = "0.22"
tokio-tungstenite = "0.29.0"
mdns-sd = "0.21.0"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
# Story 12.4：进程内拉起 relay（build_router）做中继路径集成测试
relay-server = { path = "../../relay-server" }
# axum::serve 在测试中承载 relay 路由（版本对齐 relay-server）
axum = { version = "0.8", features = ["ws"] }

[features]
perf-test = []

[dependencies.sysinfo]
version = "0.32"
default-features = false
features = ["system"]
