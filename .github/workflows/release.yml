name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Task 3: CHANGELOG 自动生成（基于 conventional commits）──
  changelog:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.build_changelog.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          mode: "COMMIT"
          configuration: ".github/changelog-configuration.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Task 1, 2, 5, 6, 7: 三平台构建 + E2E + 版本校验 + opencode binary + 签名 ──
  release:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: egosync-app/src-tauri -> target

      - name: Remove local cargo config (rsproxy mirror)
        shell: bash
        run: rm -f egosync-app/src-tauri/.cargo/config.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: egosync-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: egosync-app
        run: npm ci

      # ── Task 5: 版本号一致性校验 ──
      - name: Verify version consistency
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # semver 含 prerelease 后缀（如 0.1.6-alpha.1）：标识 alpha/beta/rc
          # 预发布构建，与纯 MAJOR.MINOR.PATCH 一样允许触发发布
          if ! echo "$TAG_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]([0-9A-Za-z.-]*[0-9A-Za-z])?)?$'; then
            echo "ERROR: Tag version '$TAG_VERSION' is not valid semver (MAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          TAURI_VERSION=$(jq -r '.version' egosync-app/src-tauri/tauri.conf.json)
          CARGO_VERSION=$(grep '^version' egosync-app/src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          PACKAGE_VERSION=$(jq -r '.version' egosync-app/package.json)
          echo "Tag version:      $TAG_VERSION"
          echo "tauri.conf.json:  $TAURI_VERSION"
          echo "Cargo.toml:       $CARGO_VERSION"
          echo "package.json:     $PACKAGE_VERSION"
          if [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "ERROR: tauri.conf.json version ($TAURI_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "ERROR: package.json version ($PACKAGE_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "All versions match tag: $TAG_VERSION"

      # ── Task 6: 下载真实 opencode binary（sst/opencode v1.15.10）──
      - name: Download opencode binary (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: bash
        run: |
          OPENCODE_VERSION="v1.15.10"
          ASSET="opencode-windows-x64.zip"
          URL="https://github.com/sst/opencode/releases/download/${OPENCODE_VERSION}/${ASSET}"
          echo "Downloading $URL"
          curl -L --fail -o opencode.zip "$URL"
          unzip -o opencode.zip -d opencode-tmp
          BINARY=$(find opencode-tmp -name "opencode*.exe" -type f | head -1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: opencode.exe not found in archive"
            ls -R opencode-tmp
            exit 1
          fi
          cp "$BINARY" egosync-app/src-tauri/resources/opencode.exe
          rm -f egosync-app/src-tauri/resources/opencode.placeholder
          rm -rf opencode.zip opencode-tmp
          ls -la egosync-app/src-tauri/resources/
          ./egosync-app/src-tauri/resources/opencode.exe --version

      - name: Download opencode binary (macOS)
        if: matrix.platform.os == 'macos-latest'
        run: |
          OPENCODE_VERSION="v1.15.10"
          ASSET="opencode-darwin-arm64.zip"
          URL="https://github.com/sst/opencode/releases/download/${OPENCODE_VERSION}/${ASSET}"
          echo "Downloading $URL"
          curl -L --fail -o opencode.zip "$URL"
          unzip -o opencode.zip -d opencode-tmp
          BINARY=$(find opencode-tmp -name "opencode*" -type f ! -name "*.exe" | head -1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: opencode binary not found in archive"
            ls -R opencode-tmp
            exit 1
          fi
          cp "$BINARY" egosync-app/src-tauri/resources/opencode
          chmod +x egosync-app/src-tauri/resources/opencode
          rm -f egosync-app/src-tauri/resources/opencode.placeholder
          rm -rf opencode.zip opencode-tmp
          ls -la egosync-app/src-tauri/resources/
          ./egosync-app/src-tauri/resources/opencode --version

      - name: Download opencode binary (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          OPENCODE_VERSION="v1.15.10"
          ASSET="opencode-linux-x64.tar.gz"
          URL="https://github.com/sst/opencode/releases/download/${OPENCODE_VERSION}/${ASSET}"
          echo "Downloading $URL"
          curl -L --fail -o opencode.tar.gz "$URL"
          mkdir -p opencode-tmp
          tar -xzf opencode.tar.gz -C opencode-tmp
          BINARY=$(find opencode-tmp -name "opencode*" -type f ! -name "*.exe" | head -1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: opencode binary not found in archive"
            ls -R opencode-tmp
            exit 1
          fi
          cp "$BINARY" egosync-app/src-tauri/resources/opencode
          chmod +x egosync-app/src-tauri/resources/opencode
          rm -f egosync-app/src-tauri/resources/opencode.placeholder
          rm -rf opencode.tar.gz opencode-tmp
          ls -la egosync-app/src-tauri/resources/
          ./egosync-app/src-tauri/resources/opencode --version

      # ── Task 2: E2E 测试 (Windows/Linux only, 不用 continue-on-error) ──
      # ⚠️ E2E 阶段暂时跳过：tauri-driver 在 CI 环境中存在平台兼容性问题
      #    （Ubuntu: spawn 找不到可执行文件 / WebKit webview 创建失败；
      #     Windows: tauri-driver socket 连接 UND_ERR_SOCKET 不稳定）
      #    与 ci.yml 保持一致（commit b0590e1），待 tauri-driver / wdio 9 兼容性稳定后重新启用。
      #    Release 质量由 CI 阶段保证（tag 在 main 上打，main 已通过 CI）。
      - name: Install tauri-driver
        if: matrix.platform.os != 'macos-latest' && false
        run: cargo install tauri-driver --locked

      - name: Install MS Edge Driver (Windows)
        if: matrix.platform.os == 'windows-latest' && false
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
        shell: powershell

      - name: Install Linux E2E dependencies
        if: matrix.platform.os == 'ubuntu-latest' && false
        run: |
          sudo apt-get install -y webkit2gtk-driver xvfb

      - name: Build release binary for E2E
        if: matrix.platform.os != 'macos-latest' && false
        working-directory: egosync-app
        run: npm run tauri build -- --no-bundle -- --features perf-test

      - name: Install E2E dependencies
        if: matrix.platform.os != 'macos-latest' && false
        working-directory: egosync-app/tests/e2e
        run: npm ci

      - name: Run E2E tests (Linux)
        if: matrix.platform.os == 'ubuntu-latest' && false
        working-directory: egosync-app/tests/e2e
        run: xvfb-run --auto-servernum npm test

      - name: Run E2E tests (Windows)
        if: matrix.platform.os == 'windows-latest' && false
        working-directory: egosync-app/tests/e2e
        run: npm test

      - name: Upload E2E screenshots on failure
        if: failure() && matrix.platform.os != 'macos-latest' && false
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-release-${{ matrix.platform.os }}
          path: egosync-app/tests/e2e/screenshots/

      - name: Upload E2E logs on failure
        if: failure() && matrix.platform.os != 'macos-latest' && false
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-release-${{ matrix.platform.os }}
          path: egosync-app/tests/e2e/logs/

      # ── Task 1, 7: tauri-action 构建 + 上传 Release + 签名（可选）──
      # ⚠️ 签名 secrets 当前未配置 — 不注入 APPLE_*/TAURI_SIGNING_* 环境变量
      #    tauri-action 在这些 env vars 不存在时自动跳过签名（构建未签名包）
      #    已知问题（tauri-action#234）：空字符串 env var 仍会触发签名流程导致失败
      #    配置证书后：在 env: 中添加对应 secrets（APPLE_CERTIFICATE 等）
      # ── 发布前冒烟：真实启动一次产物，拦截「CI 全绿但装上打不开」 ──
      # WHY: v0.1.6-alpha.1 曾带 setup 阶段 panic 发版——单测全绿（#[tokio::test]
      # 自带运行时），E2E 已禁用，唯一可靠的拦截是拉起产物验证进程存活。
      # panic（exit code 101）或提前退出即失败并附 stderr；tauri-action 复用
      # 同一 target 缓存，额外开销约 1-2 分钟。
      - name: Smoke test - launch app (Windows)
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        working-directory: egosync-app
        run: |
          npm run tauri build -- --no-bundle
          $exe = "src-tauri/target/release/egosync.exe"
          if (-not (Test-Path $exe)) { Write-Host "ERROR: $exe not found"; exit 1 }
          $err = "$env:TEMP\egosync_smoke_stderr.txt"
          $p = Start-Process -FilePath $exe -RedirectStandardError $err -PassThru
          $deadline = (Get-Date).AddSeconds(15)
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) { Start-Sleep -Milliseconds 500 }
          if ($p.HasExited) {
            Write-Host "=== APP EXITED EARLY (exit code $($p.ExitCode)) - startup crash ==="
            Write-Host "=== stderr ==="
            Get-Content $err -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed: app survived 15s"

      - name: Set build args
        id: build_args
        shell: bash
        run: |
          if [ "${{ matrix.platform.os }}" = "macos-latest" ]; then
            echo "args=--target aarch64-apple-darwin" >> $GITHUB_OUTPUT
          else
            echo "args=" >> $GITHUB_OUTPUT
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing — 配置证书后取消注释（tauri-action#234: 空 env var 会触发签名失败）
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing — 配置证书后取消注释
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EgoSync ${{ github.ref_name }}'
          releaseBody: ${{ needs.changelog.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          args: ${{ steps.build_args.outputs.args }}

  # ── 手机伴侣 Android APK（v0.1.6-alpha.3 起随桌面同 tag 发布）──
  # WHY：debug 签名包——仓库未配置正式 keystore；且 debug 构建
  # 携带 ImeDiagnostics 接线（T-S8-A），真机 IME 诊断依赖它。
  android:
    needs: changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: companion-android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: companion-android
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        working-directory: companion-android
        run: cp app/build/outputs/apk/debug/app-debug.apk "EgoSync-Companion-${{ github.ref_name }}-debug.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: companion-android/EgoSync-Companion-*-debug.apk
          if-no-files-found: error

  # APK 挂到桌面 Release（须等 tauri-action 建好 Release，避免竞态）
  android-release-upload:
    needs: [android, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: companion-apk

      - name: Attach APK to release
        run: gh release upload "${{ github.ref_name }}" EgoSync-Companion-*-debug.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Task 4: SHA256 发布后验证（含桌面资产 + 伴侣 APK）──
  verify-release:
    needs: [release, android-release-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Assets and verify SHA256
        shell: bash
        run: |
          mkdir -p ./assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir ./assets --clobber
          echo "=== Downloaded assets ==="
          ls -la ./assets/
          echo "=== SHA256 checksums ==="
          cd ./assets
          sha256sum * | tee sha256sums.txt
          for f in *; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty or missing"
              exit 1
            fi
          done
          echo "=== All assets verified (non-empty, SHA256 computed) ==="
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
