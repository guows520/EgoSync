<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EgoSync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      (function(){
        var t=localStorage.getItem('egosync-theme');
        if(t==='dark'||(t==null&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')
      })()
    </script>
    <style>
      #egosync-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #F1F3F5;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      .dark #egosync-splash { background-color: #1E293B; }
      #egosync-splash-icon {
        width: 72px;
        height: 72px;
        filter: grayscale(1) opacity(0.5);
        animation: egosync-breathe 2.4s ease-in-out infinite;
      }
      .dark #egosync-splash-icon {
        filter: grayscale(1) brightness(1.8) opacity(0.4);
      }
      @keyframes egosync-breathe {
        0%, 100% { transform: scale(0.92); opacity: 0.35; }
        50%      { transform: scale(1.08); opacity: 0.75; }
      }
      #egosync-splash.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="egosync-splash">
      <img id="egosync-splash-icon" src="/src/assets/egosync-logo.svg" alt="" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
