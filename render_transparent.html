<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #00FF00; /* 纯绿幕 */
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .logo-container {
      width: 512px;
      height: 512px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      width: 512px;
      height: 512px;
      display: block;
    }
  </style>
</head>
<body>
  <!-- 左半区：V2 极简透明底版本 -->
  <div class="logo-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <defs>
        <linearGradient id="minimalGradV2_1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4F46E5" />
          <stop offset="60%" stop-color="#6366F1" />
          <stop offset="100%" stop-color="#06B6D4" />
        </linearGradient>
        <filter id="softGlowV2_1" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>
      <g transform="translate(100, 100)">
        <circle cx="0" cy="0" r="54" fill="none" stroke="url(#minimalGradV2_1)" stroke-width="14" stroke-linecap="round" stroke-dasharray="245 80" transform="rotate(-40)"/>
        <circle cx="20" cy="20" r="17" fill="#FFFFFF" filter="url(#softGlowV2_1)" />
      </g>
    </svg>
  </div>
  
  <!-- 右半区：V2 极简带底色版本 -->
  <div class="logo-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="background:#0B0F19; border-radius:32px;">
      <defs>
        <linearGradient id="minimalGradV2_2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4F46E5" />
          <stop offset="60%" stop-color="#6366F1" />
          <stop offset="100%" stop-color="#06B6D4" />
        </linearGradient>
        <filter id="softGlowV2_2" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>
      <rect width="200" height="200" fill="#0B0F19" rx="32"/>
      <g transform="translate(100, 100)">
        <circle cx="0" cy="0" r="54" fill="none" stroke="url(#minimalGradV2_2)" stroke-width="14" stroke-linecap="round" stroke-dasharray="245 80" transform="rotate(-40)"/>
        <circle cx="20" cy="20" r="17" fill="#FFFFFF" filter="url(#softGlowV2_2)" />
      </g>
    </svg>
  </div>
</body>
</html>
